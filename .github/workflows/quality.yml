name: Quality and Security
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps -e .
      - run: ruff check . && ruff format --check . && mypy && pytest -q
      - run: pip-audit -r requirements.lock
      - run: playwright install --with-deps chromium
      - run: python scripts/browser_smoke.py
  sast:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Semgrep rules and security audit
        run: >-
          docker run --rm -v "$PWD:/src" -w /src
          -e SEMGREP_SEND_METRICS=off semgrep/semgrep@sha256:529ee8a277ec8adc5b534d7c74eea0a47e9de21d62852b6ba7ac6ba9566845c3
          semgrep scan --error --metrics=off --config=p/python
          --config=p/security-audit --config=.semgrep.yml src
  dast:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements.lock && python -m pip install --no-deps -e .
      - name: Start isolated scan target
        run: |
          uvicorn printforge.presentation.api:app --host 127.0.0.1 --port 8787 > /tmp/printforge.log 2>&1 &
          python scripts/wait_for_server.py
      - name: Passive ZAP baseline (warnings fail)
        run: |
          mkdir -p zap-report
          chmod 777 zap-report
          docker run --rm --network host -v "$PWD/zap-report:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy@sha256:7aaa659b0d43078febd82e29bad112285c370727e86ab8340444220e17d9f0d2 zap-baseline.py -t http://127.0.0.1:8787 -r report.html -J report.json -m 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: zap-report
          path: zap-report/

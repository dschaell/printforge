[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "printforge"
version = "0.1.0"
description = "Local print preparation with Upscayl"
requires-python = ">=3.12,<3.15"
license = "AGPL-3.0-or-later"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "Pillow>=12.2,<14"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1", "mypy>=1.15,<2", "pip-audit>=2.9,<3", "playwright>=1.50,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
printforge = ["presentation/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S603", "S607"]

[tool.mypy]
strict = true
packages = ["printforge"]
mypy_path = "src"
